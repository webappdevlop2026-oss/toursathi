<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TourSathi | দুর্গাপুর পূজা গাইড</title><style>body{margin:0;background:#fff8ef;font-family:system-ui;color:#172347}header{background:#101b44;color:white;padding:20px}main{max-width:960px;margin:auto;padding:20px}.hero{background:linear-gradient(120deg,#141343,#ff263e);border-radius:22px;color:white;padding:45px 25px}h1{font-size:clamp(32px,6vw,58px);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.card{background:white;border-radius:16px;padding:23px;box-shadow:0 4px 15px #0001}button{border:0;background:#f52548;color:white;padding:12px;border-radius:9px;cursor:pointer}input{padding:14px;width:90%;margin:15px 0;border:1px solid #ddd;border-radius:10px}</style></head><body><header><b>📍 TourSathi</b> — দুর্গাপুর, পশ্চিমবঙ্গ</header><main><section class="hero"><h1>শুভ দুর্গাপূজা 🌺</h1><p>ঠাকুর দেখুন • ঘুরুন • খান • থাকুন</p><h2>সব এক অ্যাপে</h2></section><h2>প্যান্ডেল খুঁজুন</h2><input id="search" placeholder="এলাকা বা প্যান্ডেল খুঁজুন" oninput="filter()"><div class="grid" id="cards"></div><h2>সুবিধাসমূহ</h2><div class="grid"><div class="card">🛕 সব প্যান্ডেল</div><div class="card">🧭 রুট পরিকল্পনা</div><div class="card">🍲 খাবার</div><div class="card">🏨 হোটেল</div><div class="card">🅿️ পার্কিং</div><div class="card">👨‍👩‍👧‍👦 গ্রুপ ট্যুর</div></div><p>⚠️ সমস্ত প্যান্ডেল ডেটা ডেমো। বাস্তব তথ্য যাচাই না করে ব্যবহার করবেন না।</p><p><a href="../admin/index.html">Admin demo</a></p></main><script>const items=[['ডেমো প্যান্ডেল ১','সিটি সেন্টার'],['ডেমো প্যান্ডেল ২','বেনাচিতি'],['ডেমো প্যান্ডেল ৩','বিধাননগর']];function filter(){const q=document.getElementById('search').value;document.getElementById('cards').innerHTML=items.filter(x=>x.join(' ').includes(q)).map(x=>'<div class="card"><h3>🛕 '+x[0]+'</h3><p>📍 '+x[1]+', দুর্গাপুর</p><button onclick="alert(\'প্রকৃত প্যান্ডেল লোকেশন যাচাইয়ের পরে নেভিগেশন যুক্ত হবে\')">রুট দেখুন</button></div>').join('')}filter()</script></body></html>
