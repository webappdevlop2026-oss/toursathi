<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TourSathi Admin Demo</title><style>body{font:16px system-ui;background:#f4f6fb;color:#132143;margin:0}header{background:#162248;color:white;padding:22px}main{max-width:850px;margin:25px auto;padding:18px}.card{background:white;padding:22px;border-radius:16px;margin-bottom:16px}input,textarea{width:95%;padding:12px;margin:7px 0;border:1px solid #ccd;border-radius:8px}button{background:#ef2950;color:white;padding:12px 20px;border:0;border-radius:8px;cursor:pointer}li{padding:8px;border-bottom:1px solid #eee}</style></head><body><header><h2>TourSathi — Admin Panel (Demo)</h2></header><main><div class="card"><b>⚠️ শুধুমাত্র লোকাল UI ডেমো</b><p>লগইন, সার্ভার, অ্যাকাউন্ট ও স্থায়ী ডেটাবেস এখনো যুক্ত নয়। এই পৃষ্ঠা Public-এ deploy করবেন না।</p></div><div class="card"><h2>প্যান্ডেল তালিকা (এই ব্রাউজারে সাময়িক)</h2><ul id="list"></ul></div><div class="card"><h2>ডেমো প্যান্ডেল যোগ করুন</h2><input id="name" placeholder="প্যান্ডেলের নাম"><input id="area" placeholder="এলাকা"><textarea id="desc" placeholder="বিবরণ"></textarea><button onclick="add()">যোগ করুন</button></div></main><script>let data=[['ডেমো প্যান্ডেল ১','সিটি সেন্টার']];function render(){document.querySelector('#list').innerHTML=data.map((x,i)=>'<li>'+x[0]+' — '+x[1]+' <button onclick="del('+i+')">মুছুন</button></li>').join('')}function add(){let n=document.querySelector('#name').value.trim(),a=document.querySelector('#area').value.trim();if(!n||!a)return alert('নাম ও এলাকা লিখুন');data.push([n,a]);render();document.querySelector('#name').value='';document.querySelector('#area').value=''}function del(i){data.splice(i,1);render()}render()</script></body></html>
